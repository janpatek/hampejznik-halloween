<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16121D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ECE7F1" media="(prefers-color-scheme: light)">
<title>Hampejzníkova halloweenská noc – ovladač hry</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,700;1,400&family=Grenze+Gotisch:wght@600;700&display=swap">
<style>
:root{
  --bg:#ECE7F1; --surface:#FBF9FD; --surface-2:#E3DCEB; --ink:#2A1F33; --muted:#625570; --line:#D2C8DE;
  --flame:#A4520B;
  --c-narr:#A4520B; --c-hamp:#4A7130; --c-jisk:#14797A; --c-roz:#93660E; --c-splo:#146B5B; --c-boh:#8A431D;
  --char:var(--flame);
  --display:'Grenze Gotisch', Georgia, 'Times New Roman', serif;
  --text:'Alegreya', Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --r-lg:18px; --r-sm:12px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16121D; --surface:#211A2A; --surface-2:#2C2338; --ink:#F2E7D0; --muted:#B5A8C0; --line:#3B3048;
    --flame:#F2A03A;
    --c-narr:#F2A03A; --c-hamp:#9BC27A; --c-jisk:#8FE6DF; --c-roz:#E8B95E; --c-splo:#5FC9B2; --c-boh:#E2915F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16121D; --surface:#211A2A; --surface-2:#2C2338; --ink:#F2E7D0; --muted:#B5A8C0; --line:#3B3048;
  --flame:#F2A03A;
  --c-narr:#F2A03A; --c-hamp:#9BC27A; --c-jisk:#8FE6DF; --c-roz:#E8B95E; --c-splo:#5FC9B2; --c-boh:#E2915F;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* hlavička */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 4px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(21px,5.2vw,30px);line-height:1.05;margin:0;color:var(--flame)}
.meta{display:flex;flex-direction:column;align-items:flex-end;font-size:15px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
#nextpair{color:var(--flame);font-weight:700}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:16px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--tabc,var(--flame));color:var(--bg);border-color:transparent;font-weight:700}

main{padding-bottom:150px}

/* hlavní postava stanoviště */
.hero{display:flex;gap:16px;align-items:center;margin:24px 0 8px}
.hero .mark{flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--char)}
.hero h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,8vw,46px);line-height:1;margin:0;color:var(--char)}
.hero .place{margin:6px 0 0;color:var(--muted);max-width:60ch}
h3.sub{font-size:20px;margin:26px 0 4px;color:var(--char)}

.cue{margin:14px 0;padding:2px 0 2px 14px;border-left:3px solid var(--char);color:var(--muted);font-style:italic;max-width:62ch}
.tag{font-size:15px;color:var(--muted);font-style:italic;margin:0}

/* replika */
.line{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 14px 12px;margin:10px 0;cursor:pointer}
.line:hover{border-color:var(--char)}
.play{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--char);color:var(--bg);font-size:17px;line-height:1}
.play .i-stop{display:none}
.speaking .play .i-play{display:none}
.speaking .play .i-stop{display:inline}
.line .lbl{display:block;font-size:15px;font-weight:700;color:var(--char);margin-bottom:2px}
.line .txt{display:block;max-width:64ch}
.line .para{display:block}
.line .para + .para{margin-top:8px}

/* svíčkové světlo, když postava mluví */
.speaking,.running{border-color:var(--char) !important;animation:flicker 2.6s infinite}
@keyframes flicker{
  0%,100%{box-shadow:0 0 0 1px var(--char),0 0 22px -6px var(--char)}
  23%{box-shadow:0 0 0 1px var(--char),0 0 34px -2px var(--char)}
  41%{box-shadow:0 0 0 1px var(--char),0 0 15px -7px var(--char)}
  68%{box-shadow:0 0 0 1px var(--char),0 0 30px -3px var(--char)}
}

/* widgety */
.widget,.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin:12px 0}
.qa{border-radius:var(--r-sm);padding:12px 14px;margin:8px 0}
.widget h3{margin:0 0 4px;font-size:20px;color:var(--char)}
.qa .q{margin:0 0 10px;max-width:62ch}
.ans{margin:10px 0 0;font-weight:700;color:var(--char)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:16px;padding:8px 15px;min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.btn:hover{border-color:var(--char)}
.btn.primary{background:var(--char);color:var(--bg);border-color:transparent;font-weight:700}
.btn.small{font-size:15px;padding:4px 12px;min-height:34px}
.btn[aria-pressed="true"]{background:var(--char);color:var(--bg);border-color:transparent;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.trow{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px}
.digits{font-weight:700;font-size:54px;line-height:1;color:var(--char);font-variant-numeric:lining-nums tabular-nums;min-width:3.6ch}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pstatus{margin:0 0 8px}
.steps{margin:10px 0 12px;padding-left:24px;color:var(--muted)}
.steps li{margin:2px 0}
.steps li.cur{color:var(--char);font-weight:700}
.namegen-out{font-family:var(--display);font-size:40px;line-height:1.1;margin:12px 0 0;color:var(--char);min-height:1.1em}

/* zvuky */
.sfxrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;padding:6px 12px;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chip:hover{border-color:var(--flame)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.board .chip{flex-direction:column;justify-content:center;border-radius:var(--r-lg);padding:18px 10px;font-size:17px;min-height:110px}
.board .chip .e{font-size:34px;line-height:1}
.nextst{margin:30px 0 0}

/* nastavení */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin:12px 0}
.set h3{margin:0 0 6px;font-size:20px;color:var(--char)}
.set label{display:block;font-size:16px;margin:10px 0 2px;color:var(--muted)}
.set label output{color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
select{width:100%;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--char)}
.set .acts{margin-top:12px}

/* spodní lišta */
.nowbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.nowbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.now{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px}
.now .who{font-weight:700;color:var(--char);white-space:nowrap}
.now .what{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.now .dot{flex:none;width:10px;height:15px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:var(--line)}
.now.on .dot{background:radial-gradient(ellipse at 50% 75%,#FFF3C4 0%,#FFC34D 40%,#F07A1A 75%);animation:dance 1.4s ease-in-out infinite;transform-origin:50% 90%}
.ctrls{display:flex;gap:8px}
.btn.stop{font-weight:700}

/* úvodní obrazovka */
.start{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:28px 22px;overflow:auto}
.start .card{max-width:560px}
.start h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,11vw,72px);line-height:.95;color:var(--flame);margin:0 0 18px}
.start p{max-width:54ch}
.vstatus{color:var(--muted);font-style:italic}
.btn.big{font-size:18px;padding:12px 22px;min-height:52px}
.flame{position:relative;width:36px;height:58px;margin:0 0 26px 8px}
.flame::before{content:"";position:absolute;inset:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 76%,#FFF6D2 0%,#FFC94F 34%,#F2811E 68%,rgba(242,129,30,0) 72%);box-shadow:0 0 46px 12px rgba(255,166,56,.28);animation:dance 2.6s ease-in-out infinite;transform-origin:50% 92%}
.flame::after{content:"";position:absolute;left:50%;bottom:-12px;width:3px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
@keyframes dance{
  0%,100%{transform:scale(1,1) rotate(-1deg)}
  25%{transform:scale(.93,1.07) rotate(2deg)}
  50%{transform:scale(1.04,.95) rotate(-2deg)}
  75%{transform:scale(.97,1.04) rotate(1deg)}
}
@media (prefers-reduced-motion: reduce){
  .speaking,.running{animation:none;box-shadow:0 0 0 2px var(--char)}
  .flame::before,.now.on .dot{animation:none}
}
@media (min-width:720px){ body{font-size:19px} }
</style>
</head>
<body>

<div class="start" id="start">
  <div class="card">
    <div class="flame" aria-hidden="true"></div>
    <h1>Hampejzníkova halloweenská noc</h1>
    <p>Ovladač hry pro dospělé. Klepnete na repliku a postava promluví svým hlasem. V pozadí hraje strašidelná hudba a občas zahouká sova nebo zavrzají dveře.</p>
    <p class="vstatus" id="startVoice">Hledám české hlasy…</p>
    <div class="acts">
      <button class="btn primary big" id="goMusic">Spustit s hudbou</button>
      <button class="btn big" id="goQuiet">Spustit bez hudby</button>
    </div>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <div class="row">
      <h1>Hampejzníkova halloweenská noc</h1>
      <div class="meta"><span id="clock"></span><span id="nextpair" hidden></span></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Části hry"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="nowbar">
  <div class="wrap">
    <div class="now" id="now" aria-live="polite"><span class="dot" aria-hidden="true"></span><span class="who">Ticho</span><span class="what">Klepněte na repliku a postava promluví.</span></div>
    <div class="ctrls">
      <button class="btn toggle" id="tMusic" aria-pressed="false">Hudba</button>
      <button class="btn toggle" id="tRandom" aria-pressed="false">Zvuky</button>
      <button class="btn stop" id="bStop">Zastavit</button>
    </div>
  </div>
</div>

<noscript><p class="wrap">Ovladač potřebuje zapnutý JavaScript.</p></noscript>

<script>

  { id: 'zahrada', tab: 'Zahrada', num: 1, char: 'jiskricka', title: 'Bludička Jiskřička',

    if (this.count >= this.total) return;

    this.count++; this.alert = false; clearInterval(this.iv); this.iv = null;
    if (this.count < this.total) {
      this.nextAt = Date.now() + this.interval * 1000;
      this.iv = setInterval(function () { self.tick(); }, 500);
    } else {
      this.nextAt = null;
      whenIdle(function () { Speech.say('vypravecka', 'Všechny dvojice jsou na cestě.', { key: 'pairs' }); });
    }
    this.update();
  },
  tick: function () {
    var self = this;
    if (this.nextAt && Date.now() >= this.nextAt) {
      this.nextAt = null; clearInterval(this.iv); this.iv = null; this.alert = true;
      playSfx('bell1');
      setTimeout(function () {
        whenIdle(function () { Speech.say('vypravecka', 'Moje milé příšerky, ' + ORD[self.count] + ' dvojice může vyrazit!', { key: 'pairs' }); });
      }, 1200);
    }
    this.update();
  },
  reset: function () { clearInterval(this.iv); this.iv = null; this.count = 0; this.nextAt = null; this.alert = false; this.update(); },
  left: function () { return this.nextAt ? Math.max(0, Math.ceil((this.nextAt - Date.now()) / 1000)) : null; },
  update: function () {
    updateHeader();
    var u = this.ui, self = this;
    if (!u) return;
    var l = this.left();
    u.status.textContent = 'Na cestě: ' + this.count + ' ze ' + this.total + ' dvojic.';
    u.digits.textContent = l != null ? fmt(l) : (this.alert ? 'Teď!' : (this.count >= this.total ? 'Hotovo' : '–'));
    u.btn.textContent = this.count >= this.total ? 'Všechny vyrazily' : 'Vyrazila ' + (this.count + 1) + '. dvojice';
    u.btn.disabled = this.count >= this.total;
    $$('button', u.opts).forEach(function (b, i) { b.setAttribute('aria-pressed', String(INTERVALS[i] === self.interval)); });
  }
};

/* ---------- hlavička ---------- */
var startedAt = null;
function updateHeader() {
  var c = $('#clock'); if (c) c.textContent = startedAt ? 'Hra běží ' + fmt((Date.now() - startedAt) / 1000) : '';
  var np = $('#nextpair');
  if (np) {
    var l = Pairs.left();
    np.textContent = l != null ? 'Další dvojice za ' + fmt(l) : (Pairs.alert ? 'Další dvojice může vyrazit' : '');
    np.hidden = !np.textContent;
  }
}

/* ---------- vykreslení ---------- */
var TABS = STATIONS.map(function (st) {
  return { id: st.id, emoji: st.emoji || CHARS[st.char].emoji, label: st.num ? st.num + ' ' + st.tab : st.tab, color: CHARS[st.char].color };
}).concat([
  { id: 'zvuky', emoji: '🔔', label: 'Zvuky', color: 'var(--flame)' },
  { id: 'nastaveni', emoji: '⚙️', label: 'Nastavení', color: 'var(--flame)' }
]);
var active = (location.hash || '').slice(1);
if (!TABS.some(function (t) { return t.id === active; })) active = 'uvod';

function renderTabs() {
  var nav = $('#tabs'); nav.innerHTML = '';
  TABS.forEach(function (tb) {
    nav.append(h('button', { role: 'tab', 'aria-selected': String(tb.id === active), style: '--tabc:' + tb.color, onclick: function () { go(tb.id); } },
      h('span', { 'aria-hidden': 'true' }, tb.emoji), h('span', null, tb.label)));
  });
}
function go(id) {
  active = id;
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* file:// bez historie */ }
  renderTabs(); renderMain();
  window.scrollTo(0, 0);
  var sel = $('#tabs [aria-selected="true"]');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function hero(emoji, title, place, color) {
  return h('div', { class: 'hero', style: '--char:' + color },
    h('div', { class: 'mark', 'aria-hidden': 'true' }, emoji),
    h('div', null, h('h2', null, title), place ? h('p', { class: 'place' }, place) : null));
}
function renderMain() {
  var main = $('#main'); main.innerHTML = '';
  var st = STATIONS.filter(function (s) { return s.id === active; })[0];
  if (st) main.append(renderStation(st));
  else if (active === 'zvuky') main.append(renderBoard());
  else main.append(renderSettings());
  if (Speech.current) highlight(Speech.current.key);
  if (Seq.running) Seq.mark(Seq.running, Seq.curIdx);
}
function renderStation(st) {
  var ch = CHARS[st.char];
  var box = h('section', { style: '--char:' + ch.color });
  box.append(hero(st.emoji || ch.emoji, st.id === 'uvod' ? st.title : ch.name, st.place, ch.color));
  st.items.forEach(function (it, i) {
    var key = st.id + '-' + i, c = it.c || st.char;
    var el = null;
    if (it.t === 'cue') el = h('p', { class: 'cue' }, it.text);
    else if (it.t === 'h') el = h('h3', { class: 'sub' }, it.text);
    else if (it.t === 'line') el = renderLine(it, key);
    else if (it.t === 'riddle') el = renderRiddle(it, key, c);
    else if (it.t === 'tf') el = renderTF(it, key, c);
    else if (it.t === 'seq') el = renderSeq(it, key);
    else if (it.t === 'quick') el = renderQuick(it, key);
    else if (it.t === 'timer') el = renderTimer(it, key);
    else if (it.t === 'pairs') el = renderPairs();
    else if (it.t === 'namegen') el = renderNamegen();
    else if (it.t === 'sfx') el = renderSfxRow(it.list);
    if (el) box.append(el);
  });
  var idx = STATIONS.indexOf(st), nx = STATIONS[idx + 1];
  if (nx) box.append(h('p', { class: 'nextst' }, h('button', { class: 'btn', onclick: function () { go(nx.id); } }, 'Další: ' + CHARS[nx.char].name)));
  return box;
}
function renderLine(it, key) {
  var ch = CHARS[it.c];
  var paras = it.text.split('\n\n').map(function (p) { return h('span', { class: 'para' }, p); });
  return h('button', { class: 'line', 'data-key': key, style: '--char:' + ch.color, onclick: function () { playLine(it, key); } },
    h('span', { class: 'play', 'aria-hidden': 'true' }, h('span', { class: 'i-play' }, '▶\uFE0E'), h('span', { class: 'i-stop' }, '■\uFE0E')),
    h('span', null, h('span', { class: 'lbl' }, ch.emoji + ' ' + it.label), h('span', { class: 'txt' }, paras)));
}
function sayFrom(c, text, key) { clickTok++; Seq.stop(); Speech.say(c, text, { key: key }); }
function renderRiddle(it, key, c) {
  var ch = CHARS[c];
  var ans = h('p', { class: 'ans', hidden: true }, 'Odpověď: ' + it.a);
  return h('div', { class: 'qa', 'data-key': key, style: '--char:' + ch.color },
    it.older ? h('p', { class: 'tag' }, 'Pro starší děti') : null,
    h('p', { class: 'q' }, '„' + it.q + '“'),
    h('div', { class: 'acts' },
      h('button', { class: 'btn primary', onclick: function () { sayFrom(c, it.q, key); } }, 'Přečíst'),
      h('button', { class: 'btn', onclick: function () { ans.hidden = false; sayFrom(c, it.say, key); } }, 'Odpověď')),
    ans);
}
function renderTF(it, key, c) {
  var ch = CHARS[c];
  var ans = h('p', { class: 'ans', hidden: true }, it.truth ? 'Pravda, děti kvákají.' : 'Nepravda, žbluňk a dřep.');
  return h('div', { class: 'qa', 'data-key': key, style: '--char:' + ch.color },
    h('p', { class: 'q' }, '„' + it.q + '“'),
    h('div', { class: 'acts' },
      h('button', { class: 'btn primary', onclick: function () { sayFrom(c, it.q, key); } }, 'Přečíst'),
      h('button', { class: 'btn', onclick: function () {
        ans.hidden = false;
        var tok = ++clickTok; Seq.stop(); Speech.stop();
        playSfx(it.truth ? 'frogs' : 'splash', 0.8);
        setTimeout(function () { if (tok === clickTok) Speech.say(c, it.say, { key: key }); }, 900);
      } }, 'Odpověď')),
    ans);
}
function renderSeq(it, key) {
  var ch = CHARS[it.c];
  var lis = [];
  it.steps.forEach(function (s, i) { if (s.say) lis.push(h('li', { 'data-i': i }, s.say)); });
  return h('div', { class: 'widget', 'data-seq': key, 'data-key': key, style: '--char:' + ch.color },
    h('h3', null, ch.emoji + ' ' + it.label),
    it.note ? h('p', { class: 'tag' }, it.note) : null,
    h('ol', { class: 'steps' }, lis),
    h('button', { class: 'btn primary', 'data-seqbtn': key, onclick: function () {
      if (Seq.running === key) { stopAll(); return; }
      clickTok++; Speech.stop(); Seq.run(key, it.steps, it.c);
    } }, Seq.running === key ? 'Zastavit' : 'Spustit'));
}
function renderQuick(it, key) {
  var ch = CHARS[it.c];
  return h('div', { class: 'opts', style: '--char:' + ch.color },
    it.note ? h('span', { class: 'tag' }, it.note) : null,
    it.list.map(function (q) {
      return h('button', { class: 'btn primary', onclick: function () {
        clickTok++; Seq.stop();
        if (q.sfx) playSfx(q.sfx);
        Speech.say(it.c, q.say, { key: key });
      } }, q.label);
    }));
}
var Timers = {};
function renderTimer(it, key) {
  var ch = CHARS[it.c];
  var s = Timers[key] || (Timers[key] = { sec: it.seconds, left: null, phase: 'idle', iv: null, update: null });
  var digits = h('div', { class: 'digits' });
  var startB = h('button', { class: 'btn primary' });
  var opts = h('div', { class: 'opts' }, it.options.map(function (o) {
    return h('button', { class: 'btn small', onclick: function () { if (s.phase !== 'idle') return; s.sec = o; update(); } }, o + ' s');
  }));
  function update() {
    digits.textContent = s.phase === 'count' ? String(s.left) : String(s.sec);
    startB.textContent = s.phase === 'idle' ? 'Spustit odpočet' : 'Zastavit odpočet';
    $$('button', opts).forEach(function (b, i) { b.setAttribute('aria-pressed', String(it.options[i] === s.sec)); b.disabled = s.phase !== 'idle'; });
  }
  s.update = update;
  startB.addEventListener('click', function () {
    if (s.phase !== 'idle') { clearInterval(s.iv); s.iv = null; s.phase = 'idle'; s.left = null; update(); return; }
    clickTok++; Seq.stop();
    s.phase = 'intro'; update();
    Speech.say(it.c, it.startText, { key: key }).then(function () {
      if (s.phase !== 'intro') return;
      s.phase = 'count'; s.left = s.sec; if (s.update) s.update();
      s.iv = setInterval(function () {
        s.left--;
        if (s.left > 0) playSfx('tick', s.left <= 5 ? 1 : 0.45);
        if (s.left <= 0) {
          clearInterval(s.iv); s.iv = null; s.phase = 'idle'; s.left = null;
          playSfx('sparkle');
          Speech.say(it.c, it.endText, { key: key });
        }
        if (s.update) s.update();
      }, 1000);
    });
  });
  update();
  return h('div', { class: 'widget', 'data-key': key, style: '--char:' + ch.color },
    h('h3', null, ch.emoji + ' Odpočet na zapamatování'),
    h('p', { class: 'tag' }, 'Jiskřička ohlásí start, pak tiká odpočet a na konci zazvoní kouzlo.'),
    h('div', { class: 'trow' }, digits, h('div', null, startB, opts)));
}
function renderPairs() {
  var status = h('p', { class: 'pstatus' }), digits = h('div', { class: 'digits' });
  var btn = h('button', { class: 'btn primary', onclick: function () { Pairs.release(); } });
  var reset = h('button', { class: 'btn', onclick: function () { Pairs.reset(); } }, 'Vynulovat');
  var opts = h('div', { class: 'opts' }, h('span', { class: 'tag' }, 'Rozestup:'),
    INTERVALS.map(function (sec) { return h('button', { class: 'btn small', onclick: function () { Pairs.interval = sec; Pairs.update(); } }, fmt(sec)); }));
  Pairs.ui = { status: status, digits: digits, btn: btn, opts: opts };
  var el = h('div', { class: 'widget', 'data-key': 'pairs', style: '--char:var(--c-narr)' },
    h('h3', null, 'Pouštění dvojic'),
    h('p', { class: 'tag' }, 'Po vyražení dvojice běží odpočet. Na konci zazní zvon a vypravěčka pustí další dvojici.'),
    h('div', { class: 'trow' }, digits, h('div', null, status, h('div', { class: 'acts' }, btn, reset))),
    opts);
  Pairs.update();
  return el;
}
function renderNamegen() {
  var out = h('p', { class: 'namegen-out', 'aria-live': 'polite' });
  return h('div', { class: 'widget' },
    h('h3', null, 'Kouzelná jména pro věci z krabice'),
    h('p', { class: 'tag' }, 'Klepněte a vylosujte první slovo, vy doplníte název věci.'),
    h('div', { class: 'opts' }, h('button', { class: 'btn primary', onclick: function () {
      var w = pick(ADJ);
      out.textContent = w.charAt(0).toUpperCase() + w.slice(1) + ' …';
      playSfx('sparkle', 0.5);
    } }, 'Vylosovat slovo')),
    out);
}
function sfxChip(name) {
  var s = SFX[name];
  return h('button', { class: 'chip', onclick: function () { playSfx(name); } }, h('span', { class: 'e', 'aria-hidden': 'true' }, s.e), h('span', null, s.label));
}
function renderSfxRow(list) {
  return h('div', { class: 'sfxrow' }, h('span', { class: 'tag' }, 'Zvuky k zastávce:'), list.map(sfxChip));
}
function renderBoard() {
  return h('section', { style: '--char:var(--flame)' },
    hero('🔔', 'Zvuky', 'Klepnutím zvuk přehrajete. Hudbu a náhodné zvuky zapínáte dole na liště.', 'var(--flame)'),
    h('div', { class: 'board' }, Object.keys(SFX).filter(function (k) { return !SFX[k].hidden; }).map(sfxChip)));
}
function slider(label, obj, key, min, max, step, onChange, fmtFn) {
  fmtFn = fmtFn || function (v) { return Math.round(v * 100) + ' %'; };
  var out = h('output', null, fmtFn(obj[key]));
  var input = h('input', { type: 'range', min: min, max: max, step: step, value: obj[key], 'aria-label': label });
  input.addEventListener('input', function () {
    obj[key] = parseFloat(input.value); out.textContent = fmtFn(obj[key]); save();
    if (onChange) onChange(obj[key]);
  });
  return h('div', null, h('label', null, label + ': ', out), input);
}
function voiceSelect(cid) {
  var sel = h('select', { 'aria-label': 'Hlas pro ' + CHARS[cid].name });
  var auto = Speech.autoVoice(cid);
  sel.append(h('option', { value: '' }, 'Automaticky' + (auto ? ' (' + shortName(auto) + ')' : '')));
  var groups = [
    ['Čeština', Speech.voices.filter(function (v) { return /^cs/i.test(v.lang); })],
    ['Slovenština', Speech.voices.filter(function (v) { return /^sk/i.test(v.lang); })],
    ['Ostatní jazyky', Speech.voices.filter(function (v) { return !/^(cs|sk)/i.test(v.lang); })]
  ];
  groups.forEach(function (g) {
    if (!g[1].length) return;
    sel.append(h('optgroup', { label: g[0] }, g[1].map(function (v) { return h('option', { value: v.voiceURI }, v.name + ' (' + v.lang + ')'); })));
  });
  sel.value = settings.voices[cid] || '';
  if (sel.value !== (settings.voices[cid] || '')) sel.value = '';
  sel.addEventListener('change', function () {
    if (sel.value) settings.voices[cid] = sel.value; else delete settings.voices[cid];
    save();
  });
  return sel;
}
function renderSettings() {
  var box = h('section', { style: '--char:var(--flame)' },
    hero('⚙️', 'Nastavení', 'Hlasy postav, hlasitost a náhodné zvuky. Ukládá se v tomhle prohlížeči.', 'var(--flame)'),
    h('p', { class: 'cue' }, voiceStatus()));
  var freq = h('select', { 'aria-label': 'Jak často hrají náhodné zvuky' },
    [['casto', 'Často, každých 15–35 s'], ['obcas', 'Občas, každých 30–70 s'], ['zridka', 'Zřídka, každé 1–2,5 min']].map(function (o) { return h('option', { value: o[0] }, o[1]); }));
  freq.value = settings.randomFreq;
  freq.addEventListener('change', function () { settings.randomFreq = freq.value; save(); if (settings.randomOn && startedAt) Random.start(); });
  box.append(h('div', { class: 'set' },
    h('h3', null, 'Hlasitost'),
    slider('Hlas postav', settings, 'speechVol', 0, 1, 0.05),
    slider('Hudba', settings, 'musicVol', 0, 1, 0.05, function () { A.applyMusic(); }),
    slider('Zvuky', settings, 'sfxVol', 0, 1, 0.05, function () { A.applySfx(); }),
    h('label', null, 'Náhodné zvuky'), freq));
  Object.keys(CHARS).forEach(function (cid) {
    var ch = CHARS[cid], cs = settings.chars[cid];
    box.append(h('div', { class: 'set', style: '--char:' + ch.color },
      h('h3', null, ch.emoji + ' ' + ch.name),
      Speech.ok ? voiceSelect(cid) : null,
      slider('Výška hlasu', cs, 'pitch', 0.1, 2, 0.05, null, function (v) { return v.toFixed(2); }),
      slider('Rychlost', cs, 'rate', 0.5, 1.6, 0.05, null, function (v) { return v.toFixed(2); }),
      h('div', { class: 'acts' }, h('button', { class: 'btn primary', 'data-key': 'test-' + cid, onclick: function () {
        sayFrom(cid, 'Moje milé příšerky, tady ' + ch.name + '.', 'test-' + cid);
      } }, 'Vyzkoušet hlas'))));
  });
  box.append(h('div', { class: 'acts' }, h('button', { class: 'btn', onclick: function () {
    settings = defaults(); save(); A.applyMusic(); A.applySfx(); updateToggles(); renderMain();
  } }, 'Obnovit výchozí nastavení')));
  return box;
}

/* ---------- ovládací lišta ---------- */
function updateToggles() {
  $('#tMusic').setAttribute('aria-pressed', String(Music.on));
  $('#tRandom').setAttribute('aria-pressed', String(!!settings.randomOn));
}
$('#tMusic').addEventListener('click', function () {
  A.init(); A.resume();
  if (Music.on) { Music.stop(); settings.musicOn = false; } else { Music.start(); settings.musicOn = true; A.applyMusic(); }
  save(); updateToggles();
});
$('#tRandom').addEventListener('click', function () {
  settings.randomOn = !settings.randomOn; save();
  if (settings.randomOn) { Random.start(); playSfx('owl', 0.6); } else Random.stop();
  updateToggles();
});
$('#bStop').addEventListener('click', stopAll);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') stopAll(); });
document.addEventListener('pointerdown', function () { A.resume(); }, { passive: true });

/* ---------- spuštění ---------- */
var wakeLock = null;
function keepAwake() {
  try {
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function (w) { wakeLock = w; }).catch(function () {});
  } catch (e) { /* nepodporováno */ }
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && startedAt) { keepAwake(); A.resume(); }
});
function launch(withMusic) {
  A.init(); A.resume(); unlockSpeech();
  settings.musicOn = withMusic; save();
  if (withMusic) Music.start();
  A.applyMusic(); A.applySfx();
  if (settings.randomOn) Random.start();
  startedAt = Date.now();
  $('#start').hidden = true;
  updateToggles(); updateHeader(); keepAwake();
  playSfx('creak', 0.7);
}
$('#goMusic').addEventListener('click', function () { launch(true); });
$('#goQuiet').addEventListener('click', function () { launch(false); });
if (!settings.musicOn) { $('#goQuiet').className = 'btn primary big'; $('#goMusic').className = 'btn big'; }

setInterval(updateHeader, 1000);
renderTabs();
renderMain();
Speech.init();
})();
</script>
